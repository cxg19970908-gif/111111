<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새롬테크 주식회사 - 사원 출근 관리 시스템</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f0f9ff;color:#1e293b}
.card{background:#fff;border:1px solid #bae6fd}
</style>
</head>
<body class="min-h-screen flex flex-col">
<header class="bg-gradient-to-r from-sky-700 via-blue-700 to-indigo-800 text-white shadow-lg">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-bold">🏢 새롬테크 주식회사</h1>
      <p class="text-xs text-sky-200">사원 출근 및 근무 상황 공유 대시보드</p>
    </div>
    <div class="flex gap-2">
      <button id="export-btn" class="bg-sky-600/70 hover:bg-sky-500 text-xs px-3 py-1.5 rounded-lg border border-sky-300/40">⬇ 백업</button>
      <label class="bg-sky-600/70 hover:bg-sky-500 text-xs px-3 py-1.5 rounded-lg border border-sky-300/40 cursor-pointer">⬆ 복원
        <input type="file" id="import-file" accept=".json" class="hidden"></label>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-5">
  <div id="banner" class="bg-sky-100 border border-sky-200 rounded-2xl p-3 text-sm text-sky-900 flex gap-3 items-start">
    <span>💾</span>
    <p id="sync" class="flex-1 text-xs">연결 중...</p>
    <button onclick="this.parentNode.remove()" class="text-sky-500">✕</button>
  </div>

  <div id="stats" class="grid grid-cols-2 md:grid-cols-7 gap-3"></div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <section class="lg:col-span-5">
      <div class="card rounded-2xl p-5 shadow-sm">
        <div class="flex justify-between items-center mb-4 border-b border-sky-100 pb-3">
          <h2 id="form-title" class="font-bold">✅ 근무 상황 체크 등록</h2>
          <button id="cancel-edit-btn" class="hidden text-xs bg-slate-200 px-2.5 py-1 rounded-lg">수정 취소</button>
        </div>
        <form id="form" class="space-y-4">
          <input type="hidden" id="edit-id">
          <div>
            <label class="block text-sm font-semibold mb-1">사원 성명 <span class="text-rose-500">*</span></label>
            <input id="name" required placeholder="예: 김새롬" class="w-full px-3 py-2.5 rounded-xl border border-sky-200 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-sm font-semibold mb-1">부서</label>
              <input id="dept" placeholder="예: 개발팀" class="w-full px-3 py-2.5 rounded-xl border border-sky-200 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"></div>
            <div><label class="block text-sm font-semibold mb-1">직급</label>
              <input id="position" placeholder="예: 차장" class="w-full px-3 py-2.5 rounded-xl border border-sky-200 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"></div>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">해당 일자 <span class="text-rose-500">*</span></label>
            <input type="date" id="date" required class="w-full px-3 py-2.5 rounded-xl border border-sky-200 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-2">근태/출근 상태 <span class="text-rose-500">*</span></label>
            <div id="status-box" class="grid grid-cols-3 gap-2"></div>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">비고 / 상세 사유 (선택)</label>
            <textarea id="note" rows="2" placeholder="사유 또는 상세 업무 사항을 입력하세요." class="w-full p-3 rounded-xl border border-sky-200 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-sky-500"></textarea>
          </div>
          <button type="submit" class="w-full bg-gradient-to-r from-sky-600 to-blue-700 text-white font-semibold py-3 rounded-xl shadow-md">
            <span id="submit-text">근무 등록</span></button>
        </form>
      </div>
    </section>

    <section class="lg:col-span-7 space-y-4">
      <div class="card rounded-2xl p-4 shadow-sm flex flex-col md:flex-row gap-3">
        <input id="search" placeholder="🔍 사원/부서/직급 검색..." class="flex-1 px-3 py-2 border border-sky-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
        <div class="flex gap-2 flex-wrap">
          <input type="date" id="f-date" class="px-2.5 py-2 border border-sky-200 rounded-xl text-xs">
          <select id="f-status" class="px-2.5 py-2 border border-sky-200 rounded-xl text-xs bg-white"></select>
          <button id="reset" class="px-2.5 py-2 bg-slate-100 rounded-xl text-xs">초기화</button>
        </div>
      </div>
      <div class="card rounded-2xl shadow-sm overflow-hidden">
        <div class="p-4 bg-sky-100/60 border-b border-sky-200 flex justify-between items-center">
          <h3 class="font-bold text-sm">📋 사원 출근 기록 현황</h3>
          <span id="count" class="text-xs bg-sky-600 text-white px-2.5 py-0.5 rounded-full font-semibold">총 0건</span>
        </div>
        <div id="list" class="divide-y divide-sky-100 max-h-[560px] overflow-y-auto"></div>
      </div>
    </section>
  </div>
</main>

<footer class="py-4 text-center text-xs text-sky-800/60 border-t border-sky-200 bg-white/60">© 새롬테크 주식회사 (Saerom Tech Co., Ltd.) - All Rights Reserved.</footer>

<div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-lg opacity-0 translate-y-20 transition-all duration-300 z-50 text-sm"></div>

<script>
const KEY='saerom_tech_attendance_data';
let rec=[];
const $=id=>document.getElementById(id);
const ST={
  work:{l:'출근',e:'💼',b:'bg-emerald-100 text-emerald-800 border-emerald-200',c:'peer-checked:border-emerald-500 peer-checked:bg-emerald-50',bar:'border-emerald-500',t:'text-emerald-600'},
  annual:{l:'연차',e:'✈️',b:'bg-blue-100 text-blue-800 border-blue-200',c:'peer-checked:border-blue-500 peer-checked:bg-blue-50',bar:'border-blue-500',t:'text-blue-600'},
  half:{l:'반차',e:'⏱️',b:'bg-indigo-100 text-indigo-800 border-indigo-200',c:'peer-checked:border-indigo-500 peer-checked:bg-indigo-50'},
  vacation:{l:'휴가',e:'🏖️',b:'bg-teal-100 text-teal-800 border-teal-200',c:'peer-checked:border-teal-500 peer-checked:bg-teal-50'},
  sick:{l:'병가',e:'🏥',b:'bg-amber-100 text-amber-800 border-amber-200',c:'peer-checked:border-amber-500 peer-checked:bg-amber-50',bar:'border-amber-500',t:'text-amber-600'},
  absent:{l:'결근',e:'🚫',b:'bg-rose-100 text-rose-800 border-rose-200',c:'peer-checked:border-rose-500 peer-checked:bg-rose-50',bar:'border-rose-500',t:'text-rose-600'}
};
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('translate-y-20','opacity-0');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('translate-y-20','opacity-0'),3000)}
let db=null,myId='local',docs={};
function flat(){rec=[];for(const [u,d] of Object.entries(docs))((d&&d.records)||[]).forEach(r=>rec.push({...r,_u:u}))}
function setSync(t){$('sync').textContent=t}
async function writeList(u,list){
  list=list.map(({_u,...r})=>r);
  if(db){
    try{await db.doc('attendance/'+u).set({records:list})}
    catch(e){toast('저장 권한이 없습니다. 공유 설정에서 기여자(Contributor) 이상 권한이 필요합니다.')}
  }else{
    docs[u]={records:list};
    try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){toast('저장 중 오류가 발생했습니다.')}
    flat();refresh();
  }
}
async function init(){
  let ok=false;
  try{
    const user=window.claude&&await claude.use('user');
    db=window.claude&&await claude.use('db');
    if(db&&user){
      myId=await user.id();
      const to=setTimeout(()=>setSync('⚠️ 연결 지연 중... 잠시 후 새로고침 해주세요'),10000);
      db.collection('attendance').onSnapshot(snap=>{
        clearTimeout(to);docs={};snap.docs.forEach(d=>docs[d.id]=d.data()||{});
        flat();refresh();setSync('🟢 실시간 공유 중 – 모든 구성원의 기록이 함께 표시됩니다');
      },()=>setSync('⚠️ 공유 데이터 연결 오류'));
      ok=true;
    }
  }catch(e){}
  if(!ok){
    db=null;myId='local';
    try{const d=JSON.parse(localStorage.getItem(KEY)||'[]');docs.local={records:Array.isArray(d)?d:[]}}catch(e){docs.local={records:[]}}
    flat();refresh();setSync('💾 로컬 모드 – 이 기기에만 저장됩니다 (공유하려면 Claude에 로그인한 상태로 링크를 여세요)');
  }
}
function sortR(){rec.sort((a,b)=>a.date!==b.date?b.date.localeCompare(a.date):(b.createdAt||0)-(a.createdAt||0))}

$('status-box').innerHTML=Object.entries(ST).map(([k,s],i)=>`<label class="cursor-pointer"><input type="radio" name="status" value="${k}" class="peer sr-only" ${i?'':'checked'}><div class="py-2.5 rounded-xl border border-sky-200 bg-white text-center text-xs font-medium ${s.c} flex flex-col items-center gap-1"><span class="text-base">${s.e}</span><span>${s.l}</span></div></label>`).join('');
$('f-status').innerHTML='<option value="all">전체 상태</option>'+Object.entries(ST).map(([k,s])=>`<option value="${k}">${s.l}</option>`).join('');

function stats(){
  const n=s=>rec.filter(r=>s.includes(r.status)).length, t=rec.length, w=n(['work']);
  const items=[['전체 기록',t,'border-sky-500','text-slate-800'],['출근',w,'border-emerald-500','text-emerald-600'],['연차',n(['annual']),'border-blue-500','text-blue-600'],['반차 / 휴가',n(['half','vacation']),'border-indigo-500','text-indigo-600'],['병가',n(['sick']),'border-amber-500','text-amber-600'],['결근',n(['absent']),'border-rose-500','text-rose-600'],['출근율',(t?Math.round(w/t*100):0)+'%','border-teal-500 col-span-2 md:col-span-1','text-teal-600']];
  $('stats').innerHTML=items.map(([l,v,b,c])=>`<div class="card rounded-2xl p-4 shadow-sm border-l-4 ${b}"><p class="text-xs font-semibold text-slate-500">${l}</p><h3 class="text-2xl font-bold mt-2 ${c}">${v}</h3></div>`).join('');
}

function render(){
  const q=$('search').value.trim().toLowerCase(),fd=$('f-date').value,fs=$('f-status').value;
  const f=rec.filter(r=>(!q||[r.employeeName,r.dept,r.position].some(x=>(x||'').toLowerCase().includes(q)))&&(!fd||r.date===fd)&&(fs==='all'||r.status===fs));
  $('count').textContent=`총 ${f.length}건`;
  $('list').innerHTML=f.length?f.map(r=>{
    const s=ST[r.status]||ST.work,dp=[r.dept,r.position].filter(Boolean).join(' ');
    return `<div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-sky-50/60">
      <div class="flex gap-3"><span class="text-xl mt-0.5">${s.e}</span><div>
        <div class="flex items-center gap-2 flex-wrap"><b>${esc(r.employeeName)||'미지정'}</b>
          ${dp?`<span class="text-xs text-slate-500 bg-sky-100 px-2 py-0.5 rounded-md">${esc(dp)}</span>`:''}
          <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${s.b}">${s.l}</span></div>
        <div class="text-xs text-slate-400 mt-1">📅 ${esc(r.date)}</div>
        ${r.note?`<p class="text-xs text-slate-600 mt-1.5 bg-sky-50 p-2 rounded-lg border border-sky-100">💬 ${esc(r.note)}</p>`:''}
      </div></div>
      <div class="flex gap-2 self-end sm:self-center">
        <button onclick="editR('${r.id}')" class="px-2.5 py-1.5 text-xs text-slate-600 hover:bg-sky-100 rounded-lg">✏️ 수정</button>
        <button onclick="delR('${r.id}')" class="px-2.5 py-1.5 text-xs text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg">🗑 삭제</button>
      </div></div>`}).join('')
  :'<div class="p-8 text-center text-slate-400 text-sm">📂<br>조회된 사원 근태 기록이 없습니다.</div>';
}
function refresh(){sortR();render();stats()}

function resetForm(){
  $('form').reset();$('edit-id').value='';$('form-title').textContent='✅ 근무 상황 체크 등록';
  $('submit-text').textContent='근무 등록';$('cancel-edit-btn').classList.add('hidden');$('date').value=today();
}
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const o={employeeName:$('name').value.trim(),dept:$('dept').value.trim(),position:$('position').value.trim(),date:$('date').value,status:document.querySelector('input[name=status]:checked').value,note:$('note').value.trim()};
  const id=$('edit-id').value,old=rec.find(r=>r.id===id);
  if(id&&old){
    const u=old._u,list=rec.filter(r=>r._u===u).map(r=>r.id===id?{...r,...o,updatedAt:Date.now()}:r);
    writeList(u,list);toast('근무 정보가 수정되었습니다.');
  }else{
    const list=rec.filter(r=>r._u===myId).concat([{id:'rec_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),...o,createdAt:Date.now()}]);
    writeList(myId,list);toast('새 근태 정보가 등록되었습니다.');
  }
  resetForm();
});
window.editR=id=>{
  const r=rec.find(x=>x.id===id);if(!r)return;
  $('edit-id').value=r.id;$('name').value=r.employeeName||'';$('dept').value=r.dept||'';$('position').value=r.position||'';
  $('date').value=r.date;$('note').value=r.note||'';
  const rd=document.querySelector(`input[name=status][value="${r.status}"]`);if(rd)rd.checked=true;
  $('form-title').textContent='✏️ 근무 상황 수정';$('submit-text').textContent='수정 사항 저장';
  $('cancel-edit-btn').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});
};
let delId=null;
window.delR=id=>{
  if(delId!==id){delId=id;toast('삭제하려면 한 번 더 클릭하세요.');setTimeout(()=>delId=null,3000);return}
  delId=null;const old=rec.find(r=>r.id===id);if(!old)return;
  writeList(old._u,rec.filter(r=>r._u===old._u&&r.id!==id));toast('근태 기록이 삭제되었습니다.');
};
$('cancel-edit-btn').addEventListener('click',resetForm);
['search','f-date','f-status'].forEach(i=>$(i).addEventListener(i==='search'?'input':'change',render));
$('reset').addEventListener('click',()=>{$('search').value='';$('f-date').value='';$('f-status').value='all';render()});

$('export-btn').addEventListener('click',()=>{
  if(!rec.length){toast('내보낼 데이터가 없습니다.');return}
  const a=document.createElement('a');
  a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(rec.map(({_u,...r})=>r),null,2));
  a.download=`새롬테크_근태기록_백업_${today()}.json`;document.body.appendChild(a);a.click();a.remove();
  toast('백업 파일이 다운로드되었습니다.');
});
$('import-file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{const d=JSON.parse(ev.target.result);
      if(Array.isArray(d)){writeList(myId,d.filter(x=>x&&x.id&&x.date));toast(`총 ${d.length}건의 데이터를 불러왔습니다. (내 기록으로 복원)`)}
      else toast('유효한 근태 데이터 파일이 아닙니다.');
    }catch(err){toast('파일을 읽는 도중 오류가 발생했습니다.')}
    e.target.value='';
  };
  rd.readAsText(f);
});

$('date').value=today();init();
</script>
</body>
</html>
